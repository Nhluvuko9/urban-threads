<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>

    <title>Urban Threads</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navbar -->
    <nav>
        <div class="logo-area">
            <a href="/" data-link>
                <img src="./src/assets/ut-logo.png" alt="Urban Threads logo" class="logo">
            </a>
        </div>
        <div class="nav-links">
            <div class="catergories">
                <ul>
                    <li><a href="/" data-link>Home</a></li>
                    <li><a href="/products" data-link>Women's</a></li>
                    <li><a href="/mensCollection" data-link>Men's</a></li>
                    <li><a href="/shoes" data-link>Shoes</a></li>
                    <li><a href="/accessories" data-link>Accessories</a></li>
                </ul>
            </div>
        </div>
        <div class="personal-details">
            <div class="search-bar">
                <input type="text">
                <div class="tooltip">
                    <span class="material-symbols-outlined hover">search</span>
                    <span class="tooltip-text">Search</span>
                </div>
            </div>
             <a href="/cart" class="cart-link" data-link>
                 <div class="tooltip cart-container">
                     <span class="material-symbols-outlined hover">shopping_bag</span>
                     <span id="cart-quantity" class="cart-quantity">0</span>
                     <span class="tooltip-text">Cart</span>
                 </div>
             </a>
            <a href="login.html" id="authLink" style="text-decoration: none;">
                <div class="tooltip">
                    <span class="material-symbols-outlined hover">account_circle</span>
                    <span class="tooltip-text"  id="accountTooltip">Sign In</span>
                </div>
            </a>
        </div>
    </nav>

    <!-- Main homepage -->
    <main id="main-content">
        <div class="homepage-banner">
            <div class="top-banner">
                <img src="./src/assets/img3.jpg" alt="Homepage image" class="image3">
                <img src="./src/assets/img4.png" alt="Homepage image" class="image4">
            </div>
            <div class="middle-banner">
                <img src="./src/assets/img5.png" alt="Homepage image" class="image5">
                <img src="./src/assets/img2.jpg" alt="Homepage image" class="image2">
            </div>
            <div class="bottom-banner">
                <img src="./src/assets/img1.jpg" alt="Homepage image" class="image1">
                <img src="./src/assets/img6.jpg" alt="Homepage image" class="image6">
            </div>
        </div>

    </main>

    <!-- Script tags -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
