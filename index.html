<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>

    <title>Urban Threads</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo-area">
            <img src="./src/assets/urban-threads-logo.png" alt="Urban Threads logo" class="logo">
        </div>
        <div class="catergories">
            <ul>
                <li><a href="">Women's</a></li>
                <li><a href="">Men's</a></li>
                <li><a href="">Shoes</a></li>
                <li><a href="">Accessories</a></li>
                <li><a href="">Sale</a></li>
            </ul>
        </div>
        <div class="personal-details">
            <div class="search-bar">
                <input type="text">
                <div class="tooltip">
                    <span class="material-symbols-outlined hover">search</span>
                    <span class="tooltip-text">Search</span>
                </div>
            </div>
            <div class="tooltip">
                <span class="material-symbols-outlined hover">shopping_bag</span>
                <span class="tooltip-text">Cart</span>
            </div>
            <div class="tooltip">
                <span class="material-symbols-outlined hover">account_circle</span>
                <span class="tooltip-text">Sign In</span>
            </div>
        </div>
    </nav>
    <main>
        <button id="seed-btn" style="padding: 10px; background: rgb(221, 50, 50); color: white;">Seed Firestone Database</button>
    </main>

    <script type="module" src="src/app.js"></script>
</body>
</html>
